name: guminai

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guminai-app
    ports:
      - "8010:8000"
    volumes:
      - /volume1/docker/guminai:/app
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - ASSET_VERSION=${ASSET_VERSION}
      - CLOVA_API_KEY=${CLOVA_API_KEY}
      - CLOVA_PRIMARY_KEY=${CLOVA_PRIMARY_KEY}
      - CLOVA_REQUEST_ID=${CLOVA_REQUEST_ID}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-}
    env_file:
      - .env
    networks:
      - guminai-network
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  database:
    image: postgres:16.4
    container_name: guminai-db
    restart: unless-stopped
    volumes:
      - /volume1/docker/guminai/db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_ALLOW_EMPTY_PASSWORD: "false"
    ports:
      - "5435:5432"
    networks:
      - guminai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  guminai-network:
    driver: bridge
