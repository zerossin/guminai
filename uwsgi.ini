[uwsgi]
chdir = /app
module = app:app

# HTTP direct binding
http = :8000

master = true
processes = 4
threads = 2
enable-threads = true
single-interpreter = true
thunder-lock = false
need-app = false
vacuum = true
die-on-term = true

# Do not use Python auto-reloader in production.
py-autoreload = 0

# Graceful full-worker reload trigger: touch this file during deploy.
touch-reload = /tmp/guminai.reload

# Logging
log-date = true
disable-logging = false
log-5xx = true
log-4xx = true
